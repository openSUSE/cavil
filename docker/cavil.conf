# Configuration for the container image, every deployment specific value comes from the environment (see
# .env.example). The tuning defaults are inherited from the shipped cavil.conf, without its example integrations.
my %shipped = %{eval app->home->child('cavil.conf')->slurp or die "Cannot load shipped cavil.conf: $@"};
delete @shipped{qw(obs openid external_link_sources git)};

my $url = $ENV{CAVIL_URL} or die "CAVIL_URL is required\n";
$url =~ s!/+$!!;

return {
  %shipped,
  secrets      => [split /,/, $ENV{CAVIL_SECRETS} || die("CAVIL_SECRETS is required\n")],
  pg           => $ENV{CAVIL_PG} || die("CAVIL_PG is required\n"),
  checkout_dir => '/data/checkouts',
  tmp_dir      => '/data/incoming',
  cache_dir    => '/var/cache/cavil',
  classifier   => {
    type  => 'llama_cpp',
    url   => $ENV{CAVIL_CLASSIFIER_URL} || die("CAVIL_CLASSIFIER_URL is required\n"),
    token => $ENV{CAVIL_CLASSIFIER_TOKEN} // ''
  },
  spdx => {namespace => "$url/spdx/", license_ref_namespace => $shipped{spdx}{license_ref_namespace}},
  git  => {bin       => '/usr/bin/git'},
  $ENV{CAVIL_ADMIN} ? (admin => $ENV{CAVIL_ADMIN}) : (),
  $ENV{CAVIL_OIDC_WELL_KNOWN_URL}
  ? (
    openid => {
      key            => $ENV{CAVIL_OIDC_CLIENT_ID},
      secret         => $ENV{CAVIL_OIDC_CLIENT_SECRET},
      well_known_url => $ENV{CAVIL_OIDC_WELL_KNOWN_URL}
    }
    )
  : ()
};
